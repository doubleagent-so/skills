name: Installation or documentation issue
description: Report a reproducible problem with a skill, guide or helper.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please redact secret keys, tokens and customer data. For private security reports, email support@doubleagent.so."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Framework/platform and version, coding agent, Node.js version, and skills commit if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal example. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include relevant, redacted error output.
    validations:
      required: true
